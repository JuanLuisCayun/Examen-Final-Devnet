---
- name: Configurar Loopback33 con IPv6
  hosts: routers
  gather_facts: no

  tasks:
    - name: Habilitar enrutamiento IPv6
      ios_config:
        lines:
          - ipv6 unicast-routing

    - name: Crear Loopback33 y asignar direcciones IPv6
      ios_config:
        parents:
          - interface Loopback33
        lines:
          - ipv6 address 3001:ABCD:ABCD:1::1/128
          - ipv6 address FE80::1 link-local
          - no shutdown
        save_when: modified


